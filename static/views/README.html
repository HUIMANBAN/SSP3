<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>程序说明文档</title>
    <style>
        body {
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: rgba(40, 130, 220, 0.8);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2em;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        section {
            margin-bottom: 30px;
        }

        section h2 {
            color: rgba(40, 130, 220, 0.8);
            border-bottom: 2px solid rgba(40, 130, 220, 0.8);
            padding-bottom: 5px;
        }

        pre {
            background-color: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }

        code {
            font-family: monospace;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 0.9em;
        }

        a {
            color: rgba(40, 130, 220, 0.8);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        p {
            text-indent: 2em;
        }

<header>
    <h1>SIC Streaming Pack</h1>
    <p>简称SSP 此程序给SIC硬件运维部直播时使用</p>

<main>
    <section>

    <section>

            <li>联系方式（许文彬）：15702098276（微信同号）</li>
        </ul>
    </section>

<footer></footer>
